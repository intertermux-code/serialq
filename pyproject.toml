[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "serialq"
version = "0.1.0"
description = "One-at-a-time execution: a cross-process serial gate and FIFO job queue"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AP", email = "intertermux@gmail.com" }]
keywords = ["queue", "serial", "mutex", "lock", "job-queue", "llm", "rate-limit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/intertermux-code/serialq"
Issues = "https://github.com/intertermux-code/serialq/issues"

[project.scripts]
serialq = "serialq:main"

[tool.setuptools.packages.find]
where = ["src"]
